<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-black transition">

    <h1 class="text-center text-3xl font-bold mt-10 dark:text-white">
        Sign UP
    </h1>

    <div class="text-center mt-4">
        <button id="modeBtn" class="px-4 py-2 bg-gray-800 text-white rounded">
            Dark Mode
        </button>
    </div>

    <div class="max-w-6xl mx-auto mt-16 flex gap-10">

        <form id="form" class="w-1/2 bg-white dark:bg-gray-900 dark:text-white p-6 rounded-lg shadow">

            <input id="name" type="text" placeholder="Your fullname"
                class="w-full mb-4 p-2 border rounded dark:bg-gray-800 dark:text-white" required />

            <input id="email" type="email" placeholder="Email address"
                class="w-full mb-4 p-2 border rounded dark:bg-gray-800 dark:text-white" required />

            <input id="password" type="password" placeholder="Password"
                class="w-full mb-4 p-2 border rounded dark:bg-gray-800 dark:text-white" required />

            <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                Send
            </button>

        </form>

        <div class="w-1/2 bg-white dark:bg-gray-900 dark:text-white p-6 rounded-lg shadow">

            <input id="search" type="text" placeholder="...Search"
                class="w-full mb-4 p-2 border rounded dark:bg-gray-800 dark:text-white" />

            <table class="w-full text-left border-t">

                <thead>
                    <tr class="border-b">
                        <th class="py-2">#</th>
                        <th class="py-2">Full name</th>
                        <th class="py-2">Email</th>
                        <th class="py-2">Actions</th>
                    </tr>
                </thead>

                <tbody id="tbody"></tbody>

            </table>

        </div>

    </div>

    <script src="./main.js"></script>
</body>

</html>
